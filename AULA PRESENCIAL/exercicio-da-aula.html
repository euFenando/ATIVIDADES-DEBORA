<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio da aula</title>
</head>
<body>

    <script>
        let dia = prompt("Digite um número referente ao dia da semana: ")

        switch(dia){
            case "1"
            :alert ("Hoje é Domingo")
            break

            case "2"
            :alert ("Hoje é Segunda-feira!")
            break

            case "3"
            :alert ("Hoje é Terça-feira!")
            break

            case "4"
            :alert ("Hoje é Quarta-feira!")
            break

            case "5"
            :alert ("Hoje é Quinta-feira!")
            break

            case "6"
            :alert ("Hoje é Sexta-feira!")
            break

            case "7"
            :alert ("Hoje é Sábado!")
            break

            default: alert("Não tem mais do que 7 dias na semana, burrão!")
        }
    </script> 
</body>
</html>
