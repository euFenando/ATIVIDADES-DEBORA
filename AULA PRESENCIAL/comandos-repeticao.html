<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando comandos de repetição</title>
</head>

<body>
    <script>
        for (let contador = 0; contador <= 100; contador++) {
            if (contador % 2 == 0) {
                document.write(contador + " É par" + "<br>" + "<br>")
            } else if (contador % 2 == 1) {
                document.write(contador + " É ímpar" + "<br>" + "<br>")
            }
        }
    </script>
</body>

</html>
