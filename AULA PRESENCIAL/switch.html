<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando comando switch/case</title>
</head>
<body>
    <script>

        let semaforo = prompt("Digite a cor do semáforo: ").toLowerCase()

        switch(semaforo){
            case "vermelho"
            :alert("Pare o carroooo!")
            break

            case "amarelo"
            :alert("Atenção, diminiu aí!")
            break

            case "verde"
            :alert("Passa aí agora!")
            break

            default: alert("Não tem essa cor no semáforo, seu burro!")
        }

    </script>
</body>
</html>
