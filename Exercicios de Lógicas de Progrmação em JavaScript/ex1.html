<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
</head>

<body>
    <script>
        let num1 = parseInt(prompt("Escreva o primeiro valor: "))
        let num2 = parseInt(prompt("Escreva o Segundo valor: "))

        let adicao = num1 + num2
        let subtracao = (num1 - num2)
        let multiplicacao = (num1 * num2)
        let divisao = (num1 / num2)


        document.write("A soma dos dois valores é: " + adicao + "<br>")
        document.write("A subtração dos dois valores é: " + subtracao + "<br>")
        document.write("A multiplicação dos dois valores é: " + multiplicacao + "<br>")
        document.write("A divisão dos dois valores é: " + divisao.toFixed(2) + "<br>")
    </script>
</body>

</html>
