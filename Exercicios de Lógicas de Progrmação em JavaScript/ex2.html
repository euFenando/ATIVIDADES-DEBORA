<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2</title>
</head>
<body>
    <script>
        let raio = parseFloat(prompt("Escreva o raio do circulo: "))

        let area = ((raio * raio) * 3.14)
        let perimetro = ((raio * 2) * 3.14)

        document.write("A área do triangulo é: " + area + "<br>")
        document.write("A perimetro do triangulo é: " + perimetro.toFixed(1))


    </script>
</body>
</html>
