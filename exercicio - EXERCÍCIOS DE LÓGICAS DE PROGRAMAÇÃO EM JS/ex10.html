<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let numero = Number(prompt("Digite um número: "));

        let i = 1;

        while (i <= 10) {
            document.write(numero + " x " + i + " = " + (numero * i) + "<br>");2
            i = i + 1;
        }

    </script>
</body>

</html>
