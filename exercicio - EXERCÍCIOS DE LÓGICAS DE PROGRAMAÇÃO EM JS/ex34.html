<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let idade = Number(prompt("Digite sua idade: "))

        if (idade < 16){
            alert("Você não pode votar.")
        }else if (idade < 18){
            alert("O voto é facultativo.")
        }else if (idade <= 70){
            alert("O voto é obrigatório.")
        }else{
            alert("O voto é facultativo.")
        }

    </script>
</body>

</html>
