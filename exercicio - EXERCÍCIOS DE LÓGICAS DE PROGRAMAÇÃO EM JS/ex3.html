<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let base = Number(prompt("Escreva a base do triangulo: "))
        let altura = Number(prompt("Escreva a altura do triangulo: "))

        let area = (base * altura) / 2

        document.write("A área do triângulo é: " + area)

    </script>
</body>

</html>
