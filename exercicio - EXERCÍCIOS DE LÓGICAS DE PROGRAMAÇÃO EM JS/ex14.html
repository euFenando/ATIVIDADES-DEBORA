<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let anos = Number(prompt("Digite sua idade em anos: "));
        let meses = Number(prompt("Digite quantos meses: "));
        let dias = Number(prompt("Digite quantos dias: "));

        let totalDias = (anos * 365) + (meses * 30) + dias;

        document.write("Você tem aproximadamente " + totalDias + " dias de vida.");

    </script>
</body>

</html>
