<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let deposito = Number(prompt("Escreva o valor mensal do seu depósito: "))

        let taxa = Number(prompt("Escreva a taxa de juros mensal (%): "))

        let montante = 0

        let mes = 1

        while (mes <= 12) {

            montante = montante + deposito

            let valorJuros = montante * (taxa / 100)

            montante = montante + valorJuros

            mes = mes + 1
        }

        alert("Montante após 12 meses: R$ " + montante.toFixed(2))

    </script>
</body>

</html>
