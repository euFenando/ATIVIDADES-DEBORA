<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let raio = Number(prompt("Digite o raio do círculo:"))

        let area = Math.PI * raio ** 2
        let perimetro = 2 * Math.PI * raio

        document.write("Área: " + area.toFixed(2) + "<br>")
        document.write("Perímetro: " + perimetro.toFixed(2))

    </script>
</body>

</html>
