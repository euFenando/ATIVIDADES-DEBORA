<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let nota1 = Number(prompt("Escreva a primeira nota: "))
        let nota2 = Number(prompt("Escreva a segunda nota: "))
        let nota3 = Number(prompt("Escreva a terceira nota: "))

        let media = (nota1 * 2 + nota2 * 3 + nota3 * 5) / 10

        document.write("a média ponderada é: " + media.toFixed(2))

    </script>
</body>

</html>
