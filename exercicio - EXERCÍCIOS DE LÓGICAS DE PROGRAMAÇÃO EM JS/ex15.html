<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let salario = Number(prompt("Digite seu salário: "))
        let aumento = salario * 0.15

        let novoSalario = salario + aumento

        alert("Seu antigo salário era: R$ "+ salario)
        alert("O valor do aumento é de: R$ "+ aumento)
        alert("O valor do novo salário é de: R$ "+ novoSalario)


    </script>
</body>

</html>
