<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let idade = Number(prompt("Digite sua idade: "))
        let sexo = prompt("Digite seu sexo (M ou F): ").toUpperCase()

        if (sexo == "M" && idade >= 65) {
            alert("Você pode se aposentar!")
        } else if (sexo == "F" && idade >= 60) {
            alert("Você pode se aposentar!")
        } else {
            alert("Você ainda não pode se aposentar!")
        }

    </script>
</body>

</html>
