<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let nota1 = Number(prompt("Digite a primeira nota: "))
        let nota2 = Number(prompt("Digite a segunda nota: "))
        let nota3 = Number(prompt("Digite a terceira nota: "))

        let media = (nota1 + nota2 + nota3) / 3

        if (media >= 7){
            alert("Você foi aprovado, que sorte em!")
        }else{
            alert("Você não foi aprovado, tente novamente ano que vem vacilão!")
        }

    </script>
</body>

</html>
