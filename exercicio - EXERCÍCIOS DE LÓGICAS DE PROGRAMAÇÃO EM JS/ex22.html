<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let salario = Number(prompt("Digite o seu salário para saber o seu bonus: "))

        if (salario > 2000){
            let bonus = salario * 0.10 
            alert("Seu bonus de 10% é: R$" + bonus.toFixed(2))
        }else{
            let bonus = salario * 0.05 
            alert("Seu bonus de 5% é: R$" + bonus.toFixed(2))
        }

    </script>
</body>

</html>
