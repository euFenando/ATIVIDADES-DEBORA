<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let idade = Number(prompt("Digite sua idade: "))

        if(idade <= 12){
            alert("Você é uma criança")
        }else if (idade <= 18){
            alert("Você é um adolecente")
        }else{
            alert("Você é um adulto, já pode ser preso")
        }

    </script>
</body>

</html>
