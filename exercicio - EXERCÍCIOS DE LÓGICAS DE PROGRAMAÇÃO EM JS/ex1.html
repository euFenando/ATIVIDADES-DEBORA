<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>
<body>
    <script>

        let n1 = Number(prompt("Escreva o primeiro número: "))
        let n2 = Number(prompt("Escreva o segundo número: "))

        let soma = n1 + n2
        let subtracao = n1 - n2
        let multiplicacao = n1 * n2
        let divisao = n1 / n2

        document.write("A soma dos dois números é: " + soma + "<br>")
        document.write("A subtração dos dois números é: " + subtracao + "<br>")
        document.write("A multiplicação dos dois números é: " + multiplicacao + "<br>")
        document.write("A divisão dos dois números é: " + divisao)


    </script>
</body>
</html>
