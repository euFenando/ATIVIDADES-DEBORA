<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let salario = Number(prompt("Digite o salário base:"))

        let comissao = salario * 0.05
        let salarioLiquido = salario + comissao

        document.write("Salário base: R$ " + salario.toFixed(2) + "<br>")
        document.write("Comissão: R$ " + comissao.toFixed(2) + "<br>")
        document.write("Salário líquido: R$ " + salarioLiquido.toFixed(2))

    </script>
</body>

</html>
