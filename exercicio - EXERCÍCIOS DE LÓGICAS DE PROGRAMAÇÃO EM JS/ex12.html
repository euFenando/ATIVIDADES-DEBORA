<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let altura = Number(prompt("Digite sua altura: "))
        let peso = Number(prompt("Digite seu peso: "))

        let resultado = peso / (altura * altura)

        if (resultado <= 18.5) {
            alert("Você está abaixo do peso")
        } else if (resultado <= 24.9) {
            alert("Você está com o peso normal")
        } else if (resultado <= 29.9) {
            alert("Você está com excesso de peso")
        } else if (resultado <= 34.9) {
            alert("Você está com obesidade grau 1")
        } else if (resultado <= 39.9) {
            alert("Você está com obesidade grau 2")
        } else {
            alert("Você está com obesidade grau 3")
        }

    </script>
</body>

</html>
