<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Lógica de Programação em JavaScript.</title>
</head>

<body>
    <script>

        let nome = prompt("Digite o nome do aluno: ")
        let nota = Number(prompt("Digite a nota do aluno: "))

        if (nota >= 7){
            alert("O(a) " + nome + " está aprovado!")
        }else{
            alert("O(a) " + nome + " está de recuperação!")
        }

    </script>
</body>

</html>
