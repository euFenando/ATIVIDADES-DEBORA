<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercicio 40</title>
  </head>
  <body>
    <script>
      
        let i = 1
        let numero = Number(prompt("Escreva o número da tabuada que você quer saber: "))

        while( i <= 10){
            let resultado = i * numero
            document.write(numero + " X " + i + " = " + resultado + "<br>" + "<br>")
            i++
        }

    </script>
  </body>
</html>
