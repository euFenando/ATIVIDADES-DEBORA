<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercicio 39</title>
  </head>
  <body>
    <script>
      
        let i = 1
        let soma = 0

        while(i <= 5){
            let numero = Number(prompt("Digite o " + i + "º número:"));
            soma = soma + numero
            i++
        }

        let media = soma / 5

        document.write("A média aritimédica é: " + media)

    </script>
  </body>
</html>
