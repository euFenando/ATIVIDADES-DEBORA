<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercicio 37</title>
  </head>
  <body>
    <script>

      let i = 1
      let soma = 0

      while (i <= 100) {
        soma = soma + i
        i++
      }

      document.write("O resultado da soma dos números de 1 a 100 é: " + "<br>" + "<br>" + soma)
      
    </script>
  </body>
</html>
